[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-copilot"
version = "1.0.0"
description = "Profile Excel workbooks into a typed context graph and answer questions with a validated planner -> coder -> IR -> sandbox pipeline"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.70",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5"]

[project.scripts]
excel-copilot = "excel_copilot.cli:main"

[tool.setuptools.packages.find]
include = ["excel_copilot*"]

[tool.setuptools.package-data]
excel_copilot = ["sandbox/runtime.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
